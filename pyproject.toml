[project]
name = "tripflow-multi-agent"
version = "0.1.0"
description = "A transparent multi-agent travel planning workflow with policy checks and human review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn>=0.35.0",
  "httpx>=0.28.0",
  "pydantic>=2.11.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["assets*", "static*"]

[tool.pytest.ini_options]
pythonpath = ["."]
