name: tripflow

services:
  tripflow:
    build: .
    ports:
      - "8015:8015"
    volumes:
      - tripflow-checkpoints:/app/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8015/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tripflow-checkpoints:
