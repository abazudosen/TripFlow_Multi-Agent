<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">TripFlow completed booking and itinerary</title>
  <desc id="desc">TripFlow shows a completed Tokyo trip after human approval, with the itinerary, quote breakdown, and booking reference.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity=".2"/></filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #64748b; }
      .card { fill: #fff; stroke: #e2e8f0; }
    </style>
  </defs>
  <rect width="1440" height="940" fill="#f5f7fb"/>
  <path d="M0 0h1440v214H0z" fill="url(#hero)"/>
  <text x="54" y="58" fill="#fff" font-size="31" font-weight="750">TripFlow — Multi-Agent Travel Planning</text>
  <text x="54" y="92" fill="#dbeafe" font-size="17">Human approval is checkpointed, revalidated, and handed back to the Coordinator.</text>
  <g font-size="15" font-weight="650">
    <rect x="54" y="139" width="145" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="73" cy="158" r="5" fill="#93c5fd"/><text x="87" y="164" fill="#bfdbfe">🧭 Planner</text>
    <rect x="211" y="139" width="169" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="230" cy="158" r="5" fill="#c4b5fd"/><text x="244" y="164" fill="#ddd6fe">🔍 Researcher</text>
    <rect x="392" y="139" width="182" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="411" cy="158" r="5" fill="#fcd34d"/><text x="425" y="164" fill="#fde68a">🛡️ Policy Guard</text>
    <rect x="586" y="139" width="179" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="605" cy="158" r="5" fill="#6ee7b7"/><text x="619" y="164" fill="#a7f3d0">🧩 Coordinator</text>
    <rect x="777" y="139" width="197" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="796" cy="158" r="5" fill="#f9a8d4"/><text x="810" y="164" fill="#fbcfe8">👤 Human Reviewer</text>
  </g>
  <rect x="38" y="240" width="815" height="660" rx="18" class="card"/>
  <text x="72" y="283" class="muted" font-size="17" font-weight="750" letter-spacing="1.1">YOUR REQUEST</text>
  <rect x="72" y="304" width="747" height="82" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="98" y="339" font-size="19" font-weight="700" fill="#047857">✅  Booking complete</text>
  <text x="98" y="366" font-size="15" fill="#475569">Booking complete for Tokyo. Reference: TRIP-1284C5DF. Quoted total: $1537.</text>
  <text x="72" y="429" class="muted" font-size="17" font-weight="750" letter-spacing="1.1">TRIP SNAPSHOT</text>
  <text x="72" y="467" font-size="13" fill="#64748b" font-weight="750" letter-spacing="1">TRIP</text>
  <text x="72" y="500" font-size="14" fill="#64748b">Destination</text><text x="819" y="500" text-anchor="end" font-size="15" font-weight="650">Tokyo</text>
  <text x="72" y="532" font-size="14" fill="#64748b">Month</text><text x="819" y="532" text-anchor="end" font-size="15" font-weight="650">next month</text>
  <text x="72" y="564" font-size="14" fill="#64748b">Travelers</text><text x="819" y="564" text-anchor="end" font-size="15" font-weight="650">2</text>
  <text x="72" y="596" font-size="14" fill="#64748b">Budget</text><text x="819" y="596" text-anchor="end" font-size="15" font-weight="650">$1,800</text>
  <text x="72" y="640" font-size="13" fill="#64748b" font-weight="750" letter-spacing="1">QUOTES</text>
  <text x="72" y="672" font-size="14" fill="#64748b">✈️ Flight</text><text x="819" y="672" text-anchor="end" font-size="15" font-weight="650">$907</text>
  <text x="72" y="704" font-size="14" fill="#64748b">🏨 Hotel</text><text x="819" y="704" text-anchor="end" font-size="15" font-weight="650">$520</text>
  <text x="72" y="736" font-size="14" fill="#64748b">🛡️ Insurance</text><text x="819" y="736" text-anchor="end" font-size="15" font-weight="650">$110</text>
  <path d="M72 753h747" stroke="#e2e8f0"/>
  <text x="72" y="783" font-size="15" font-weight="750">Total</text><text x="819" y="783" text-anchor="end" font-size="17" font-weight="750">$1,537</text>
  <text x="72" y="827" font-size="13" fill="#64748b" font-weight="750" letter-spacing="1">POLICY</text>
  <text x="72" y="858" font-size="14" fill="#64748b">Approval limit</text><text x="819" y="858" text-anchor="end" font-size="15" font-weight="650">$1,200</text>
  <rect x="875" y="240" width="527" height="660" rx="18" class="card"/>
  <text x="909" y="283" class="muted" font-size="17" font-weight="750" letter-spacing="1.1">AGENT TRACE</text>
  <rect x="909" y="304" width="459" height="68" rx="10" fill="#f5f3ff"/>
  <text x="929" y="329" font-size="14" font-weight="700">🔍  Researcher</text>
  <text x="929" y="352" class="muted" font-size="13">Estimated travel quotes • total $1,537</text>
  <rect x="909" y="384" width="459" height="68" rx="10" fill="#fffbeb"/>
  <text x="929" y="409" font-size="14" font-weight="700">🛡️  Policy Guard</text>
  <text x="929" y="432" class="muted" font-size="13">Approval gate triggered; checkpoint saved.</text>
  <rect x="909" y="464" width="459" height="68" rx="10" fill="#fdf2f8"/>
  <text x="929" y="489" font-size="14" font-weight="700">👤  Human Reviewer</text>
  <text x="929" y="512" class="muted" font-size="13">Approval granted. Resuming workflow.</text>
  <rect x="909" y="544" width="459" height="68" rx="10" fill="#f8fafc"/>
  <text x="929" y="569" font-size="14" font-weight="700">💾  Checkpoint</text>
  <text x="929" y="592" class="muted" font-size="13">Restored state and revalidated policy.</text>
  <rect x="909" y="624" width="459" height="68" rx="10" fill="#ecfdf5"/>
  <text x="929" y="649" font-size="14" font-weight="700">🧩  Coordinator</text>
  <text x="929" y="672" class="muted" font-size="13">Booking completed • reference TRIP-1284C5DF</text>
  <rect x="909" y="718" width="459" height="136" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="933" y="754" font-size="17" font-weight="750">The handoff is complete</text>
  <text x="933" y="785" class="muted" font-size="14">Approval resumed from saved state, policy was checked</text>
  <text x="933" y="808" class="muted" font-size="14">again, and the Coordinator completed the workflow.</text>
  <rect x="250" y="106" width="940" height="810" rx="0" fill="#0f172a" opacity=".47"/>
  <rect x="291" y="151" width="858" height="704" rx="24" fill="#fff" filter="url(#shadow)"/>
  <text x="339" y="201" font-size="27" font-weight="750">🎉 Trip Booked!</text>
  <path d="M339 224h762" stroke="#e2e8f0"/>
  <g font-size="17">
    <text x="339" y="267" fill="#64748b">Destination</text><text x="1101" y="267" text-anchor="end" font-weight="700">Tokyo</text>
    <path d="M339 286h762" stroke="#eef2f7"/>
    <text x="339" y="325" fill="#64748b">Month</text><text x="1101" y="325" text-anchor="end" font-weight="700">next month</text>
    <path d="M339 344h762" stroke="#eef2f7"/>
    <text x="339" y="383" fill="#64748b">Travelers</text><text x="1101" y="383" text-anchor="end" font-weight="700">2</text>
    <path d="M339 402h762" stroke="#eef2f7"/>
    <text x="339" y="441" fill="#64748b">Budget</text><text x="1101" y="441" text-anchor="end" font-weight="700">$1,800</text>
    <path d="M339 460h762" stroke="#eef2f7"/>
    <text x="339" y="499" fill="#64748b">✈️ Flight</text><text x="1101" y="499" text-anchor="end" font-weight="700">$907</text>
    <path d="M339 518h762" stroke="#eef2f7"/>
    <text x="339" y="557" fill="#64748b">🏨 Hotel</text><text x="1101" y="557" text-anchor="end" font-weight="700">$520</text>
    <path d="M339 576h762" stroke="#eef2f7"/>
    <text x="339" y="615" fill="#64748b">🛡️ Insurance</text><text x="1101" y="615" text-anchor="end" font-weight="700">$110</text>
    <path d="M339 634h762" stroke="#eef2f7"/>
    <text x="339" y="673" fill="#64748b" font-weight="750">Total</text><text x="1101" y="673" text-anchor="end" fill="#059669" font-size="20" font-weight="750">$1,537</text>
    <path d="M339 692h762" stroke="#eef2f7"/>
    <text x="339" y="731" fill="#64748b">Booking Ref</text>
    <rect x="905" y="706" width="196" height="36" rx="18" fill="#ecfdf5"/>
    <text x="1003" y="730" text-anchor="middle" fill="#047857" font-size="15" font-family="ui-monospace, monospace" font-weight="750">TRIP-1284C5DF</text>
  </g>
  <rect x="979" y="779" width="122" height="50" rx="11" fill="#64748b"/>
  <text x="1040" y="811" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Close</text>
</svg>
