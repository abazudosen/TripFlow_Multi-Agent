<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">TripFlow multi-agent workflow overview</title>
  <desc id="desc">The TripFlow app with a Tokyo travel request, structured trip state, and a trace showing Planner and Researcher handoffs.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="button" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".07"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #64748b; }
      .small { font-size: 15px; }
      .label { font-size: 14px; fill: #64748b; }
      .value { font-size: 15px; font-weight: 650; }
      .card { fill: #fff; stroke: #e2e8f0; }
    </style>
  </defs>
  <rect width="1440" height="940" fill="#f5f7fb"/>
  <path d="M0 0h1440v214H0z" fill="url(#hero)"/>
  <text x="54" y="58" fill="#fff" font-size="31" font-weight="750">TripFlow — Multi-Agent Travel Planning</text>
  <text x="54" y="92" fill="#dbeafe" font-size="17">Five specialist agents plan, price, and police your trip — with a human in the loop whenever it matters.</text>
  <text x="54" y="118" fill="#dbeafe" font-size="17">Watch each handoff appear in the trace in real time.</text>
  <g font-size="15" font-weight="650">
    <rect x="54" y="148" width="145" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="73" cy="167" r="5" fill="#93c5fd"/><text x="87" y="173" fill="#bfdbfe">🧭 Planner</text>
    <rect x="211" y="148" width="169" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="230" cy="167" r="5" fill="#c4b5fd"/><text x="244" y="173" fill="#ddd6fe">🔍 Researcher</text>
    <rect x="392" y="148" width="182" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="411" cy="167" r="5" fill="#fcd34d"/><text x="425" y="173" fill="#fde68a">🛡️ Policy Guard</text>
    <rect x="586" y="148" width="179" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="605" cy="167" r="5" fill="#6ee7b7"/><text x="619" y="173" fill="#a7f3d0">🧩 Coordinator</text>
    <rect x="777" y="148" width="197" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="796" cy="167" r="5" fill="#f9a8d4"/><text x="810" y="173" fill="#fbcfe8">👤 Human Reviewer</text>
  </g>
  <rect x="38" y="240" width="815" height="660" rx="18" class="card" filter="url(#shadow)"/>
  <text x="72" y="283" class="muted" font-size="17" font-weight="750" letter-spacing="1.1">YOUR REQUEST</text>
  <rect x="72" y="304" width="747" height="88" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="98" y="339" font-size="19" font-weight="700">📝  Gathering trip details</text>
  <text x="98" y="367" class="muted" font-size="16">Start by telling me where you want to go, your budget, the month, and how many travelers.</text>
  <text x="72" y="431" class="label" font-weight="650">TRAVEL REQUEST ID</text>
  <rect x="72" y="443" width="747" height="48" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="89" y="474" fill="#475569" font-size="15" font-family="ui-monospace, monospace">1284c5df-ceed-459b-8fad-25f348d4279d</text>
  <text x="72" y="527" class="label" font-weight="650">DESCRIBE YOUR TRIP</text>
  <rect x="72" y="540" width="747" height="91" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="91" y="573" font-size="16">Book a trip to Tokyo next month with budget 1800 for 2 travelers</text>
  <rect x="72" y="651" width="747" height="54" rx="11" fill="url(#button)"/>
  <text x="445" y="685" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Send Request Details</text>
  <rect x="72" y="735" width="747" height="129" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="97" y="772" font-size="17" font-weight="700">A visible, role-based workflow</text>
  <text x="97" y="803" class="muted" font-size="15">Planner structures the request. Researcher gathers options.</text>
  <text x="97" y="830" class="muted" font-size="15">Policy Guard checks the quote before the Coordinator routes next.</text>
  <rect x="875" y="240" width="527" height="290" rx="18" class="card" filter="url(#shadow)"/>
  <text x="909" y="283" class="muted" font-size="17" font-weight="750" letter-spacing="1.1">TRIP SNAPSHOT</text>
  <text x="909" y="327" font-size="13" fill="#64748b" font-weight="750" letter-spacing="1">TRIP</text>
  <text x="909" y="362" class="label">Destination</text><text x="1367" y="362" text-anchor="end" class="value">Tokyo</text>
  <path d="M909 377h459" stroke="#eef2f7"/>
  <text x="909" y="405" class="label">Month</text><text x="1367" y="405" text-anchor="end" class="value">next month</text>
  <path d="M909 420h459" stroke="#eef2f7"/>
  <text x="909" y="448" class="label">Travelers</text><text x="1367" y="448" text-anchor="end" class="value">2</text>
  <path d="M909 463h459" stroke="#eef2f7"/>
  <text x="909" y="491" class="label">Budget</text><text x="1367" y="491" text-anchor="end" class="value">$1,800</text>
  <rect x="875" y="551" width="527" height="349" rx="18" class="card" filter="url(#shadow)"/>
  <text x="909" y="594" class="muted" font-size="17" font-weight="750" letter-spacing="1.1">AGENT TRACE</text>
  <rect x="909" y="615" width="459" height="56" rx="10" fill="#f8fafc"/>
  <text x="929" y="639" font-size="14" font-weight="700">⚙️  System  ·  15:07:41</text>
  <text x="929" y="659" class="muted" font-size="13">Session created.</text>
  <rect x="909" y="683" width="459" height="76" rx="10" fill="#eff6ff"/>
  <text x="929" y="707" font-size="14" font-weight="700">🧭  Planner  ·  15:07:50</text>
  <text x="929" y="729" class="muted" font-size="13">Applied extracted updates.</text>
  <text x="929" y="748" fill="#64748b" font-size="11" font-family="ui-monospace, monospace">destination · budget · month · travelers</text>
  <rect x="909" y="771" width="459" height="76" rx="10" fill="#f5f3ff"/>
  <text x="929" y="795" font-size="14" font-weight="700">🔍  Researcher  ·  15:07:50</text>
  <text x="929" y="817" class="muted" font-size="13">Gathering flight, hotel, and insurance quotes.</text>
  <text x="929" y="837" fill="#64748b" font-size="11" font-family="ui-monospace, monospace">quote sources run in parallel</text>
</svg>
