<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">TripFlow request awaiting human approval</title>
  <desc id="desc">A Tokyo trip quote totals 1,537 dollars, exceeds the approval limit, and pauses for human review while agent trace explains the decision.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".07"/></filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #64748b; }
      .label { font-size: 14px; fill: #64748b; }
      .value { font-size: 15px; font-weight: 650; }
      .card { fill: #fff; stroke: #e2e8f0; }
    </style>
  </defs>
  <rect width="1440" height="940" fill="#f5f7fb"/>
  <path d="M0 0h1440v214H0z" fill="url(#hero)"/>
  <text x="54" y="58" fill="#fff" font-size="31" font-weight="750">TripFlow — Multi-Agent Travel Planning</text>
  <text x="54" y="92" fill="#dbeafe" font-size="17">Every handoff is traceable. Every policy decision has an explicit reason.</text>
  <g font-size="15" font-weight="650">
    <rect x="54" y="139" width="145" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="73" cy="158" r="5" fill="#93c5fd"/><text x="87" y="164" fill="#bfdbfe">🧭 Planner</text>
    <rect x="211" y="139" width="169" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="230" cy="158" r="5" fill="#c4b5fd"/><text x="244" y="164" fill="#ddd6fe">🔍 Researcher</text>
    <rect x="392" y="139" width="182" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="411" cy="158" r="5" fill="#fcd34d"/><text x="425" y="164" fill="#fde68a">🛡️ Policy Guard</text>
    <rect x="586" y="139" width="179" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="605" cy="158" r="5" fill="#6ee7b7"/><text x="619" y="164" fill="#a7f3d0">🧩 Coordinator</text>
    <rect x="777" y="139" width="197" height="38" rx="19" fill="#ffffff1c" stroke="#ffffff40"/><circle cx="796" cy="158" r="5" fill="#f9a8d4"/><text x="810" y="164" fill="#fbcfe8">👤 Human Reviewer</text>
  </g>
  <rect x="38" y="240" width="815" height="660" rx="18" class="card" filter="url(#shadow)"/>
  <text x="72" y="283" class="muted" font-size="17" font-weight="750" letter-spacing="1.1">YOUR REQUEST</text>
  <rect x="72" y="304" width="747" height="100" rx="14" fill="#fffbeb" stroke="#fde68a"/>
  <text x="98" y="341" font-size="19" font-weight="700" fill="#b45309">⏳  Waiting for your approval</text>
  <text x="98" y="370" font-size="15" fill="#475569">The quoted total is $1537. That crosses the approval limit of $1200.</text>
  <text x="98" y="391" font-size="15" fill="#475569">Approve or deny the booking before resuming.</text>
  <text x="72" y="438" class="label" font-weight="650">TRAVEL REQUEST ID</text>
  <rect x="72" y="450" width="747" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="89" y="479" fill="#475569" font-size="14" font-family="ui-monospace, monospace">1284c5df-ceed-459b-8fad-25f348d4279d</text>
  <text x="72" y="529" class="label" font-weight="650">DESCRIBE YOUR TRIP</text>
  <rect x="72" y="541" width="747" height="82" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="91" y="576" font-size="16">Book a trip to Tokyo next month with budget 1800 for 2 travelers</text>
  <rect x="72" y="642" width="570" height="51" rx="10" fill="#e2e8f0"/>
  <text x="357" y="674" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="700">Send Request Details</text>
  <rect x="655" y="642" width="164" height="51" rx="10" fill="#64748b"/>
  <text x="737" y="674" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">↻ Refresh</text>
  <rect x="72" y="709" width="364" height="52" rx="10" fill="#059669"/>
  <text x="254" y="742" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">✓  Approve Booking</text>
  <rect x="448" y="709" width="371" height="52" rx="10" fill="#d97706"/>
  <text x="633" y="742" text-anchor="middle" fill="#fff" font-size="17" font-weight="750">✗  Deny</text>
  <text x="72" y="797" class="label">Quoted total</text>
  <text x="819" y="797" text-anchor="end" font-size="24" font-weight="750">$1,537</text>
  <rect x="72" y="816" width="747" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="72" y="816" width="385" height="12" rx="6" fill="#d97706"/>
  <text x="72" y="855" font-size="13" fill="#64748b">$0</text>
  <text x="436" y="855" text-anchor="middle" font-size="13" fill="#b45309">Approval $1,200</text>
  <text x="819" y="855" text-anchor="end" font-size="13" fill="#64748b">Hard limit $2,200</text>
  <rect x="875" y="240" width="527" height="383" rx="18" class="card" filter="url(#shadow)"/>
  <text x="909" y="283" class="muted" font-size="17" font-weight="750" letter-spacing="1.1">TRIP SNAPSHOT</text>
  <text x="909" y="326" font-size="13" fill="#64748b" font-weight="750" letter-spacing="1">TRIP</text>
  <text x="909" y="357" class="label">Destination</text><text x="1367" y="357" text-anchor="end" class="value">Tokyo</text>
  <text x="909" y="387" class="label">Month</text><text x="1367" y="387" text-anchor="end" class="value">next month</text>
  <text x="909" y="417" class="label">Travelers</text><text x="1367" y="417" text-anchor="end" class="value">2</text>
  <text x="909" y="447" class="label">Budget</text><text x="1367" y="447" text-anchor="end" class="value">$1,800</text>
  <text x="909" y="485" font-size="13" fill="#64748b" font-weight="750" letter-spacing="1">QUOTES</text>
  <text x="909" y="516" class="label">✈️ Flight</text><text x="1367" y="516" text-anchor="end" class="value">$907</text>
  <text x="909" y="546" class="label">🏨 Hotel</text><text x="1367" y="546" text-anchor="end" class="value">$520</text>
  <text x="909" y="576" class="label">🛡️ Insurance</text><text x="1367" y="576" text-anchor="end" class="value">$110</text>
  <path d="M909 587h459" stroke="#e2e8f0"/>
  <text x="909" y="612" font-size="15" font-weight="750">Total</text><text x="1367" y="612" text-anchor="end" font-size="17" font-weight="750">$1,537</text>
  <rect x="875" y="645" width="527" height="255" rx="18" class="card" filter="url(#shadow)"/>
  <text x="909" y="688" class="muted" font-size="17" font-weight="750" letter-spacing="1.1">WHY THE WORKFLOW PAUSED</text>
  <rect x="909" y="710" width="459" height="61" rx="10" fill="#eff6ff"/>
  <text x="929" y="735" font-size="14" font-weight="700">🔍  Researcher</text>
  <text x="929" y="757" class="muted" font-size="13">Quotes gathered in parallel: flight, hotel, insurance.</text>
  <rect x="909" y="782" width="459" height="61" rx="10" fill="#fffbeb"/>
  <text x="929" y="807" font-size="14" font-weight="700">🛡️  Policy Guard</text>
  <text x="929" y="829" class="muted" font-size="13">Approval gate triggered: $1,537 is above $1,200.</text>
  <text x="909" y="875" fill="#64748b" font-size="12">Checkpoint saved • Awaiting human reviewer decision</text>
</svg>
